# ============================================================
# Apache Doris 2.1.7 单机部署（1 FE + 1 BE）—— 开发 / 演示环境
# 依据：SPEC-ETL-Agent-v1.0 §11.1 V1（目标库需 Doris >= 2.0）
#
# 启动：docker compose up -d
# 连接：mysql -h127.0.0.1 -P8050 -uroot
#
# 【为何 BE 用固定容器 IP】曾尝试让 BE 上报 127.0.0.1 以便宿主机直连，
# 但 Doris 拒绝以回环地址注册 BE（一直 "BE is not register"）。因此维持
# BE 以真实容器 IP 172.30.80.5 注册。
# 后果：Windows Docker Desktop (WSL2) 下容器 IP 对宿主机不可路由，
# 故**数据面 SeaTunnel 必须运行在同一个 Docker 网络内**（不能跑在宿主机），
# 见 deploy/seatunnel/run-in-docker.sh。
#
# 【端口】宿主映射须避让 Windows 保留段（实测 8978-9077 含 9030）：
#   8030 = FE HTTP      8050 -> 9030 = FE MySQL 协议      8040 = BE HTTP
# ============================================================
services:
  doris-fe:
    image: apache/doris:doris-fe-2.1.7
    container_name: etl-doris-fe
    hostname: doris-fe
    environment:
      FE_SERVERS: "fe1:172.30.80.3:9010"
      FE_ID: "1"
    ports:
      - "8030:8030"   # FE HTTP：Stream Load 提交、元数据 API
      - "8050:9030"   # FE MySQL 协议（宿主 8050）：9030 被 Windows 动态保留
    networks:
      doris-net:
        ipv4_address: 172.30.80.3
    volumes:
      - doris-fe-meta:/opt/apache-doris/fe/doris-meta
      - doris-fe-log:/opt/apache-doris/fe/log
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8030/api/bootstrap || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  doris-be:
    image: apache/doris:doris-be-2.1.7
    container_name: etl-doris-be
    hostname: doris-be
    environment:
      FE_SERVERS: "fe1:172.30.80.3:9010"
      BE_ADDR: "172.30.80.5:9050"
    depends_on:
      doris-fe:
        condition: service_healthy
    ports:
      - "8040:8040"   # BE HTTP：Stream Load 数据通道（宿主机仅调试用）
    networks:
      doris-net:
        ipv4_address: 172.30.80.5
    volumes:
      - doris-be-storage:/opt/apache-doris/be/storage
      - doris-be-log:/opt/apache-doris/be/log

networks:
  doris-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.80.0/24

volumes:
  doris-fe-meta:
  doris-fe-log:
  doris-be-storage:
  doris-be-log:
