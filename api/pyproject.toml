[project]
name = "etl-agent-api"
version = "0.1.0"
description = "生产级 ETL-Agent 数据集成平台 — 控制面 API"
requires-python = ">=3.11"
dependencies = [
    # Web 框架与配置
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "python-multipart>=0.0.9",
    # 持久化
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    # 异步任务（后续 T-13 启用）
    "celery>=5.4",
    # 安全（SPEC 技术栈：Ed25519 能力令牌 / 凭据受管）
    "PyJWT>=2.8",
    "bcrypt>=4.1",
    "cryptography>=42.0",
    "hvac>=2.1",
    # 大模型（DeepSeek，OpenAI 兼容协议）
    "openai>=1.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
