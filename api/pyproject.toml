[project]
name = "etl-agent-api"
version = "0.1.0"
description = "生产级 ETL-Agent 数据集成平台 — 控制面 API"
requires-python = ">=3.11"
dependencies = [
    # Web 框架与配置
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "python-multipart>=0.0.9",
    # 持久化
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    # Doris FE 与演示 MySQL 均使用 MySQL 协议；T-16 的影子表/发布校验由控制面执行。
    "pymysql>=1.1,<2",
    "redis>=5.0",
    # 异步任务（后续 T-13 启用）
    "celery>=5.4",
    # 安全（SPEC 技术栈：Ed25519 能力令牌 / 凭据受管）
    "PyJWT>=2.8",
    "bcrypt>=4.1",
    "cryptography>=42.0",
    "hvac>=2.1",
    # 大模型（DeepSeek，OpenAI 兼容协议）
    "openai>=1.30",
    # 编排（M3 需求生成状态机，SPEC §2 技术栈：LangGraph + PostgresSaver）
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=3.0",
    # 配置语法门禁（T-08：门禁要真正解析 HOCON，而不是靠正则猜）
    "pyhocon>=0.3.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
